<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Échange — Mon profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#c8102e', dark: '#a30d25', light: '#f9e4e7' },
          appbg: '#f5f4f0', appfg: '#1a1816',
          secondarybg: '#f0ede8', mutedbg: '#e8e5e0', mutedfg: '#7a7670',
        },
        fontFamily: { sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'] },
      },
    },
  }
</script>
<link rel="stylesheet" href="css/app.css" />
<style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-mutedbg text-appfg antialiased">

<div class="app-shell">
  <header class="flex-shrink-0 px-4 pt-5 pb-4 bg-white border-b border-appfg/10">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-extrabold">Mon profil</h1>
      <button type="button" id="logout-btn" title="Se déconnecter"
              class="w-9 h-9 rounded-full bg-secondarybg border border-appfg/10 flex items-center justify-center">↪</button>
    </div>
    <div class="flex items-center gap-3">
      <div id="avatar" class="w-14 h-14 rounded-full bg-brand text-white text-xl font-bold flex items-center justify-center flex-shrink-0"></div>
      <div class="min-w-0">
        <p id="display-name" class="font-extrabold text-lg leading-tight truncate"></p>
        <p id="email" class="text-sm text-mutedfg truncate"></p>
        <span id="role-badge" class="inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-secondarybg text-mutedfg"></span>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-24">
    <div class="bg-secondarybg border border-appfg/10 rounded-xl px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-mutedbg flex items-center justify-center text-lg flex-shrink-0">💬</div>
      <div class="text-sm">
        <p class="font-bold">Contact via Teams</p>
        <p class="text-xs text-mutedfg">Bientôt disponible — pour l'instant, aucun canal de contact intégré.</p>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white border border-appfg/10 rounded-xl px-4 py-4">
        <p id="active-count" class="text-2xl font-extrabold">0</p>
        <p class="text-xs text-mutedfg mt-1">Annonces actives</p>
      </div>
      <a href="priority-friends.html" class="bg-white border border-appfg/10 rounded-xl px-4 py-4 flex items-center justify-between hover:border-brand/40 transition-colors">
        <div>
          <p id="friends-count" class="text-2xl font-extrabold">0</p>
          <p class="text-xs text-mutedfg mt-1">Amis prioritaires</p>
        </div>
        <span class="text-mutedfg">›</span>
      </a>
    </div>

    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-extrabold">Mes objets</h2>
        <a href="add-listing.html" class="inline-flex items-center gap-1.5 bg-brand hover:bg-brand-dark text-white text-sm font-bold rounded-full px-3.5 py-2 transition-colors">
          <span>+</span> Mettre à disposition
        </a>
      </div>
      <div id="my-listings" class="space-y-3">
        <p class="text-center text-sm text-mutedfg py-6">Chargement…</p>
      </div>
    </div>
  </main>

  <nav class="flex-shrink-0 h-16 bg-white border-t border-appfg/10 flex items-stretch px-2 sticky bottom-0">
    <a href="index.html" class="flex-1 flex flex-col items-center justify-center gap-1 text-mutedfg">
      <span class="text-lg leading-none">▦</span>
      <span class="text-[11px] font-bold">Accueil</span>
    </a>
    <a href="add-listing.html" class="flex-1 flex items-center justify-center">
      <span class="w-12 h-12 -mt-5 rounded-full bg-brand shadow-lg flex items-center justify-center text-white text-2xl font-bold">+</span>
    </a>
    <a href="profile.html" class="flex-1 flex flex-col items-center justify-center gap-1 text-brand">
      <span class="text-lg leading-none">◯</span>
      <span class="text-[11px] font-bold">Profil</span>
    </a>
  </nav>
</div>

<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
