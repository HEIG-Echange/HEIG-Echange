<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Échange — Mon profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-setup.js"></script>
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="text-appfg antialiased">

<nav class="side-nav" aria-label="Navigation principale"></nav>

<div class="app-shell">
  <header class="flex-shrink-0 bg-white border-b border-appfg/10 sticky top-0 z-20">
    <div class="app-container py-3 flex items-center gap-3">
      <h1 class="text-lg font-extrabold">Mon profil</h1>
      <button id="logout-btn" type="button" title="Se déconnecter" aria-label="Se déconnecter"
              class="ml-auto w-9 h-9 rounded-full bg-secondarybg flex items-center justify-center text-mutedfg hover:text-appfg transition-colors"></button>
    </div>
  </header>

  <main class="app-main">
    <div class="app-container pt-4">
      <div id="account-banner"></div>

      <!-- Deux colonnes sur desktop : carte d'identite + QR a gauche, annonces
           a droite. Empile sur mobile. -->
      <div class="grid gap-5 lg:grid-cols-[minmax(0,20rem)_minmax(0,1fr)] lg:gap-8 items-start">

        <aside class="space-y-4 lg:sticky lg:top-24">
          <section class="bg-white border border-appfg/10 rounded-2xl p-5">
            <div class="flex items-center gap-4">
              <span id="avatar" class="w-16 h-16 rounded-full bg-brand text-white text-xl font-bold flex items-center justify-center flex-shrink-0"></span>
              <div class="min-w-0">
                <p id="display-name" class="text-lg font-extrabold truncate"></p>
                <p id="email" class="text-xs text-mutedfg font-mono truncate"></p>
                <span id="role-badge" class="inline-block mt-1.5 text-[11px] font-semibold bg-secondarybg text-mutedfg rounded-full px-2.5 py-0.5"></span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-5">
              <div class="border border-appfg/10 rounded-xl px-3 py-3">
                <p id="active-count" class="text-2xl font-extrabold">—</p>
                <p class="text-xs text-mutedfg">Objets en ligne</p>
              </div>
              <a href="priority-friends.html" class="border border-appfg/10 rounded-xl px-3 py-3 hover:border-brand/40 transition-colors">
                <p id="friends-count" class="text-2xl font-extrabold">0</p>
                <p class="text-xs text-mutedfg">Amis prioritaires</p>
              </a>
            </div>
          </section>

          <!-- Partage du profil : QR code et lien, tous deux construits sur le
               domaine public (PUBLIC_BASE_URL) et non sur l'URL du navigateur. -->
          <section class="bg-white border border-appfg/10 rounded-2xl p-5 text-center">
            <h2 class="text-sm font-extrabold mb-3">Partager mon profil</h2>
            <img id="qr-img" alt="QR code de mon profil"
                 class="w-36 h-36 mx-auto rounded-xl border border-appfg/10" />
            <p id="profile-url" class="text-[11px] text-mutedfg mt-2 break-all"></p>
            <div class="flex flex-col sm:flex-row gap-2 mt-4">
              <button id="share-btn" type="button"
                      class="flex-1 text-sm font-bold border border-appfg/15 rounded-xl py-2.5 hover:bg-secondarybg transition-colors">
                Copier le lien
              </button>
              <a id="invite-btn" href="#"
                 class="flex-1 text-sm font-bold bg-brand hover:bg-brand-dark text-white rounded-xl py-2.5 transition-colors">
                Inviter par email
              </a>
            </div>
          </section>
        </aside>

        <section>
          <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
            <h2 class="text-lg font-extrabold">Mes objets</h2>
            <div class="flex items-center gap-2">
              <div id="view-toggle" class="hidden md:flex"></div>
              <a href="add-listing.html"
                 class="inline-flex items-center gap-1.5 text-sm font-bold bg-brand hover:bg-brand-dark text-white rounded-xl px-4 py-2.5 transition-colors">
                + Mettre à disposition
              </a>
            </div>
          </div>

          <div id="my-listings" class="listing-grid">
            <p class="col-span-full text-center text-sm text-mutedfg py-8">Chargement…</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Navigation principale"></nav>
</div>

<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
