<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Échange — Mettre à disposition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-setup.js"></script>
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="text-appfg antialiased">

<nav class="side-nav" aria-label="Navigation principale"></nav>

<div class="app-shell">
  <!-- Vue formulaire -->
  <div id="form-view" class="contents">
    <header class="flex-shrink-0 bg-white border-b border-appfg/10 sticky top-0 z-20">
      <div class="app-container py-3 flex items-center gap-3">
        <button type="button" onclick="history.back()" aria-label="Retour"
                class="w-9 h-9 rounded-full bg-secondarybg flex items-center justify-center flex-shrink-0 hover:bg-mutedbg transition-colors">←</button>
        <h1 class="text-lg font-extrabold">Mettre à disposition</h1>
        <!-- Sur grand ecran le bouton d'action remonte dans l'en-tete : plus
             besoin de la barre collante du bas, la page tient a l'ecran. -->
        <button id="submit-btn-desktop" type="button" data-submit-mirror
                class="hidden md:inline-flex ml-auto bg-brand hover:bg-brand-dark text-white font-bold rounded-xl px-5 py-2.5 text-sm transition-colors disabled:opacity-50">
          Publier l'annonce
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="app-container py-5 max-w-5xl">
        <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-3 py-2.5 mb-5"></div>

        <div class="form-grid">
          <!-- Photos : occupe toute la largeur, c'est le point d'entree du
               formulaire (et la source de la pre-saisie IA). -->
          <section class="form-full">
            <label for="photos-input"
                   class="block border-2 border-dashed border-appfg/20 rounded-2xl px-4 py-10 text-center cursor-pointer bg-white hover:border-brand/40 transition-colors">
              <span class="block text-2xl mb-2">⬆️</span>
              <span class="block font-bold text-sm">Ajouter des photos</span>
              <span class="block text-xs text-mutedfg mt-1">Vous pouvez en sélectionner plusieurs d'un coup</span>
            </label>
            <input id="photos-input" type="file" accept="image/*" multiple class="hidden" />

            <div class="flex items-center justify-between gap-3 mt-3">
              <div id="photo-previews" class="flex gap-2 flex-wrap flex-1"></div>
              <span id="photo-hint" class="text-xs text-mutedfg flex-shrink-0"></span>
            </div>

            <button id="ai-btn" type="button"
                    class="hidden mt-3 w-full md:w-auto inline-flex items-center justify-center gap-2 border border-brand/30 text-brand text-sm font-bold rounded-xl px-4 py-2.5 hover:bg-brand-light transition-colors disabled:opacity-50">
              ✨ Pré-remplir avec l'IA
            </button>
            <p id="ai-status" class="hidden text-[11px] text-mutedfg mt-2"></p>
          </section>

          <div class="form-full">
            <label for="title-input" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Titre *</label>
            <input id="title-input" type="text" placeholder="Ex: Calculatrice HP Prime G2"
                   class="w-full bg-white border border-appfg/15 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30" />
          </div>

          <div class="form-full">
            <label for="description-input" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Description *</label>
            <textarea id="description-input" rows="5" placeholder="Décrivez l'objet, son état, ce qui est inclus…"
                      class="w-full bg-white border border-appfg/15 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"></textarea>
          </div>

          <div>
            <label for="category-select" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Catégorie</label>
            <select id="category-select" class="w-full bg-white border border-appfg/15 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"></select>
          </div>

          <div>
            <label for="condition-select" class="block text-xs font-bold uppercase tracking-wide mb-1.5">État</label>
            <select id="condition-select" class="w-full bg-white border border-appfg/15 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"></select>
          </div>

          <div class="form-full">
            <label for="location-input" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Lieu</label>
            <input id="location-input" type="text" placeholder="Ex: HEIG-VD Yverdon, bâtiment C"
                   class="w-full bg-white border border-appfg/15 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30" />
            <p class="text-[11px] text-mutedfg mt-1">Indiquez où récupérer l'objet (champ libre, optionnel).</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Barre d'action collante : mobile uniquement (sur desktop le bouton est
         dans l'en-tete). -->
    <div class="md:hidden flex-shrink-0 p-4 bg-white border-t border-appfg/10 sticky bottom-0 z-20">
      <button id="submit-btn" type="button"
              class="w-full bg-brand hover:bg-brand-dark text-white font-bold rounded-xl py-3.5 transition-colors disabled:opacity-50">
        Publier l'annonce
      </button>
    </div>
  </div>

  <!-- Vue succes -->
  <div id="success-view" class="hidden flex-1 flex-col">
    <header class="flex-shrink-0 bg-white border-b border-appfg/10">
      <div class="app-container py-3 flex items-center gap-3">
        <a href="profile.html" aria-label="Retour au profil"
           class="w-9 h-9 rounded-full bg-secondarybg flex items-center justify-center">←</a>
        <h1 class="text-lg font-extrabold">Annonce publiée</h1>
      </div>
    </header>
    <main class="flex-1 flex flex-col items-center justify-center text-center px-8 py-16">
      <div class="w-20 h-20 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-4xl mb-6">✓</div>
      <h2 class="text-2xl font-extrabold">C'est en ligne !</h2>
      <p class="text-sm text-mutedfg mt-3 max-w-md">Votre annonce est visible par la communauté HEIG-VD. Vous pourrez la modifier à tout moment depuis votre profil.</p>
      <div class="flex flex-col sm:flex-row gap-3 mt-8 w-full max-w-md">
        <a id="success-view-listing" href="#" class="flex-1 bg-brand hover:bg-brand-dark text-white font-bold rounded-xl py-3.5 transition-colors">
          Voir l'annonce
        </a>
        <a href="index.html" class="flex-1 border border-appfg/15 bg-white font-bold rounded-xl py-3.5 hover:bg-secondarybg transition-colors">
          Retour à l'accueil
        </a>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navigation principale"></nav>
</div>

<script type="module" src="js/pages/add-listing.js"></script>
</body>
</html>
