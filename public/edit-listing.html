<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Échange — Modifier l'annonce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-setup.js"></script>
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="text-appfg antialiased">

<nav class="side-nav" aria-label="Navigation principale"></nav>

<div class="app-shell">
  <header class="flex-shrink-0 bg-white border-b border-appfg/10 sticky top-0 z-20">
    <div class="app-container py-3 flex items-center gap-3">
      <button type="button" onclick="history.back()" aria-label="Retour"
              class="w-9 h-9 rounded-full bg-secondarybg flex items-center justify-center flex-shrink-0 hover:bg-mutedbg transition-colors">←</button>
      <h1 class="text-lg font-extrabold">Modifier l'annonce</h1>
      <button id="submit-btn-desktop" type="button" data-submit-mirror
              class="hidden md:inline-flex ml-auto bg-brand hover:bg-brand-dark text-white font-bold rounded-xl px-5 py-2.5 text-sm transition-colors disabled:opacity-50">
        Enregistrer
      </button>
    </div>
  </header>

  <main class="app-main">
    <!-- Masque tant que l'annonce n'est pas chargee (et que l'on n'a pas
         verifie que le visiteur en est bien le proprietaire). -->
    <div id="loading" class="app-container py-16 text-center text-sm text-mutedfg">Chargement…</div>

    <div id="editor" class="app-container py-5 max-w-5xl hidden">
      <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm whitespace-pre-line rounded-xl px-3 py-2.5 mb-5"></div>
      <div id="saved-box" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm rounded-xl px-3 py-2.5 mb-5">
        Modifications enregistrées.
      </div>

      <div class="form-grid">
        <section class="form-full">
          <!-- Zone de dépôt : cliquable ET recevant un glisser-déposer. C'est
               un <div role="button"> et non un <label>, un label ne pouvant
               pas porter proprement les événements de drag & drop. -->
          <div id="photo-dropzone" class="photo-dropzone" role="button" tabindex="0"
               aria-controls="photos-input" aria-label="Ajouter des photos">
            <span class="block text-2xl mb-2" aria-hidden="true">⬆️</span>
            <span class="block font-bold text-sm">Ajouter des photos</span>
            <span class="block text-xs text-mutedfg mt-1">Cliquez ou déposez vos fichiers — la première photo sert de vignette</span>
          </div>
          <input id="photos-input" type="file" multiple class="hidden" />

          <div class="flex items-start justify-between gap-3 mt-3">
            <div id="photo-previews" class="flex gap-2 flex-wrap flex-1"></div>
            <span id="photo-hint" class="text-xs text-mutedfg flex-shrink-0"></span>
          </div>

          <button id="ai-btn" type="button"
                  class="hidden mt-3 w-full md:w-auto inline-flex items-center justify-center gap-2 border border-brand/30 text-brand text-sm font-bold rounded-xl px-4 py-2.5 hover:bg-brand-light transition-colors disabled:opacity-50">
            ✨ Pré-remplir avec l'IA
          </button>
          <p id="ai-status" class="hidden text-[11px] text-mutedfg mt-2"></p>
        </section>

        <div class="form-full">
          <label for="title-input" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Titre *</label>
          <input id="title-input" type="text"
                 class="w-full bg-white border border-appfg/15 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30" />
        </div>

        <div class="form-full">
          <label for="description-input" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Description *</label>
          <textarea id="description-input" rows="5"
                    class="w-full bg-white border border-appfg/15 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"></textarea>
        </div>

        <div>
          <label for="category-select" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Catégorie</label>
          <select id="category-select" class="w-full bg-white border border-appfg/15 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"></select>
        </div>

        <div>
          <label for="condition-select" class="block text-xs font-bold uppercase tracking-wide mb-1.5">État</label>
          <select id="condition-select" class="w-full bg-white border border-appfg/15 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"></select>
        </div>

        <div>
          <label for="location-input" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Lieu</label>
          <input id="location-input" type="text"
                 class="w-full bg-white border border-appfg/15 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30" />
        </div>

        <!-- Specifique a l'edition : permet de marquer l'objet reserve ou donne
             sans supprimer l'annonce. -->
        <div>
          <label for="status-select" class="block text-xs font-bold uppercase tracking-wide mb-1.5">Statut</label>
          <select id="status-select" class="w-full bg-white border border-appfg/15 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30">
            <option value="available">Disponible</option>
            <option value="reserved">Réservée</option>
            <option value="closed">Donnée</option>
          </select>
          <p class="text-[11px] text-mutedfg mt-1">Une annonce « donnée » reste visible mais signalée comme close.</p>
        </div>

        <div class="form-full pt-2 border-t border-appfg/10">
          <button id="delete-btn" type="button"
                  class="inline-flex items-center gap-2 text-sm font-bold text-red-600 border-2 border-red-200 rounded-xl px-4 py-2.5 hover:bg-red-50 transition-colors">
            Retirer définitivement l'annonce
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="submit-bar" class="md:hidden flex-shrink-0 p-4 bg-white border-t border-appfg/10 sticky bottom-0 z-20 hidden">
    <button id="submit-btn" type="button"
            class="w-full bg-brand hover:bg-brand-dark text-white font-bold rounded-xl py-3.5 transition-colors disabled:opacity-50">
      Enregistrer
    </button>
  </div>

  <nav class="bottom-nav" aria-label="Navigation principale"></nav>
</div>

<script type="module" src="js/pages/edit-listing.js"></script>
</body>
</html>
