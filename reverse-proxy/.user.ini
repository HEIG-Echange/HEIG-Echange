; ---------------------------------------------------------------------------
; Réglages PHP du proxy (hébergements en PHP-FPM / CGI, où .htaccess ne peut
; pas porter de directives php_value).
;
; enable_post_data_reading=0 est LA directive importante : sans elle, PHP lit
; et découpe lui-même les corps multipart/form-data vers $_POST / $_FILES,
; php://input arrive vide, et le proxy transmet une requête sans corps — les
; uploads de photos échouent systématiquement. À 0, PHP ne touche plus au
; corps : il traverse le proxy tel quel, quel que soit le nombre de fichiers.
;
; Conséquence : $_POST et $_FILES sont toujours vides dans index.php. C'est
; voulu — ce script ne les utilise que comme filet de sécurité si cette
; directive n'a pas pu être appliquée.
; ---------------------------------------------------------------------------
enable_post_data_reading = 0

; Utiles uniquement quand la directive ci-dessus n'a pas pu être appliquée :
; ils dimensionnent le chemin de repli (10 photos x 5 Mo au maximum).
post_max_size = 64M
upload_max_filesize = 8M
memory_limit = 128M

; Un upload de photo sur une connexion lente ne doit pas être coupé.
max_execution_time = 120
max_input_time = 120
