# ---------------------------------------------------------------------------
# HEIG-Echange — execution locale de l'image de production
#
#   docker compose up --build          construit et lance
#   docker compose down                arrete et nettoie
#
# Pour le developpement avec rechargement a chaud, voir compose.dev.yaml.
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      target: runner
      args:
        VERSION: ${VERSION:-0.1.0}
        REVISION: ${REVISION:-local}
    image: heig-echange:${VERSION:-local}

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

    # Reaper de PID 1 : evite l'accumulation de processus zombies.
    init: true
    restart: unless-stopped

    # .env est optionnel : le projet demarre avec ses valeurs par defaut.
    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      # Note: traité après env_file, donc prioritaire.
      # le port interne reste 3000
      # quoi qu'il arrive, seul le port hote est configurable.
      PORT: 3000
      # PUBLIC_BASE_URL (domaine des QR/liens) reste configurable via .env.

      # --- Stockage des images : MinIO (service "minio" ci-dessous) ---
      # Definir MINIO_ENDPOINT suffit a activer le stockage objet ; sans lui
      # l'app retomberait sur le disque (UPLOAD_DIR).
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-heig-echange}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD est requis (definir dans .env)}
      MINIO_BUCKET: ${MINIO_BUCKET:-heig-echange}

      # Repli disque : ne sert plus qu'a relire les photos televersees AVANT
      # le passage a MinIO (volume "uploads-data", voir src/storage.ts).
      UPLOAD_DIR: /app/uploads

    ports:
      - "${APP_PORT:-3000}:3000"

    # Ancien stockage des images. Les nouvelles photos vont dans MinIO ; ce
    # volume reste monte pour que celles d'avant la migration s'affichent
    # encore. Il pourra etre retire une fois qu'il sera vide.
    volumes:
      - uploads-data:/app/uploads

    # optimisation: le dossier /tmp s écrit en RAM au lieu de sur disque.
    #   -> sécu / fichiers sensibles
    # tmpfs:
    #   - /tmp

    # TODO
    ## désactivation de ...
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true


    # Rotation des logs. d'un service en restart: unless-stopped peuvent
    # remplir le disque.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-heig_echange}
      MARIADB_USER: ${MARIADB_USER:-heig}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD est requis (definir dans .env)}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD est requis (definir dans .env)}
      # NOTE : variables MARIADB_* lues par l'entrypoint MariaDB
      # durant 1ère initialisation du volume "db-data" (quand il est vide).
      # En production, changer les infos du .env n'a aucun effet (car volume n'est pas recréé).
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # MinIO — stockage objet des photos d'annonces (compatible S3).
  #
  # L'app y ecrit et y lit les images (voir src/storage.ts) ; le bucket est
  # cree automatiquement au demarrage s'il n'existe pas. L'API S3 (9000) n'est
  # JAMAIS publiee sur l'hote : seul le reseau Compose y accede, et les images
  # sont relayees aux visiteurs par l'app via /uploads/<cle>. La console
  # d'administration (9001) n'ecoute que sur 127.0.0.1 par defaut — comme
  # phpMyAdmin, on y accede a distance par un tunnel SSH.
  #
  # Image figee par tag ET par digest, comme l'image Node du Dockerfile.
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-heig-echange}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD est requis (definir dans .env)}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PMA_HOST: db
      # Bind address configurable (voir .env.example) : 0.0.0.0 pour
      # administration depuis une autre machine du reseau.
    ports:
      - "${PHPMYADMIN_BIND_ADDRESS:-0.0.0.0}:${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - db

volumes:
  db-data:
  minio-data:
  # Legacy : photos televersees avant le passage a MinIO (voir service "app").
  uploads-data:

