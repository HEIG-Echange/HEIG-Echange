# ---------------------------------------------------------------------------
# HEIG-Echange — execution locale de l'image de production
#
#   docker compose up --build          construit et lance
#   docker compose down                arrete et nettoie
#
# Pour le developpement avec rechargement a chaud, voir compose.dev.yaml.
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      target: runner
      args:
        VERSION: ${VERSION:-0.1.0}
        REVISION: ${REVISION:-local}
    image: heig-echange:${VERSION:-local}

    depends_on:
      db:
        condition: service_healthy

    # Reaper de PID 1 : evite l'accumulation de processus zombies.
    init: true
    restart: unless-stopped

    # .env est optionnel : le projet demarre avec ses valeurs par defaut.
    env_file:
      - path: .env
        required: false

    # Declare apres env_file, donc prioritaire : le port interne reste 3000
    # quoi qu'il arrive, seul le port hote est configurable.
    environment:
      NODE_ENV: production
      PORT: 3000

    ports:
      - "${APP_PORT:-3000}:3000"

    # Durcissement : le conteneur n'ecrit nulle part, ne gagne aucun privilege
    # et ne conserve aucune capability.
    # read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Garde-fous pour que le conteneur ne puisse pas saturer la machine.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    # Sans rotation, les logs d'un service en restart: unless-stopped peuvent
    # remplir le disque.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-heig_echange}
      MARIADB_USER: ${MARIADB_USER:-heig}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD est requis (definir dans .env)}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD est requis (definir dans .env)}
    # ATTENTION : ces variables MARIADB_* ne sont lues par l'entrypoint MariaDB
    # qu'a la toute premiere initialisation du volume "db-data" (quand il est
    # vide). Sur un volume deja initialise, elles sont silencieusement
    # ignorees : changer le mot de passe ou la base dans .env n'a alors aucun
    # effet tant que le volume n'est pas recree. Ce volume est nomme par
    # projet Compose (prefixe COMPOSE_PROJECT_NAME) : voir .env.example pour
    # pourquoi ce nom doit etre unique par instance sur une meme machine.
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: db
    # Bind configurable (voir .env.example) : 0.0.0.0 par defaut pour
    # permettre l'administration depuis une autre machine du reseau.
    ports:
      - "${PHPMYADMIN_BIND_ADDRESS:-0.0.0.0}:${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - db

# Nomme(s) par Compose sous la forme <COMPOSE_PROJECT_NAME>_db-data : deux
# instances avec le meme nom de projet (par defaut, le nom du dossier)
# partagent ce volume au lieu d'en avoir chacune le leur. Voir .env.example.
volumes:
  db-data:

