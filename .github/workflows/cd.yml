name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: cd-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login au registry GitHub
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image (latest + sha)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/heig-echange/heig-echange:latest
            ghcr.io/heig-echange/heig-echange:${{ github.sha }}

      - name: Redeploiement Render
        if: hashFiles('Dockerfile') != ''
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK"
            echo "Redeploiement declenche"
          else
            echo "RENDER_DEPLOY_HOOK pas encore configure, etape sautee"
          fi
