# ---------------------------------------------------------------------------
# CD — deploiement sur les machines distantes.
#
#   merge sur main            -> staging automatiquement
#   declenchement manuel      -> staging ou production
#
# La production n'est pas automatique : staging sert de filtre, et
# l'environnement "production" peut en plus exiger une approbation
# (Settings > Environments > production > Required reviewers).
# ---------------------------------------------------------------------------
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement a deployer"
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cd-main

jobs:
  # Le deploiement construit l'image sur la machine cible : on revalide donc le
  # commit ici avant de toucher a une machine, plutot que de faire confiance a
  # un run de CI voisin.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint et tests dans l'image
        run: docker build --target verify .


  staging:
    needs: verify
    if: github.event_name == 'push' || inputs.environment == 'staging'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      # deploy_path: /home/heigdeployloy/heig/staging-pdg
      deploy_path: ${{ DEPLOY_PATH }}
    secrets: inherit
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

  production:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      # deploy_path: /home/heigdeploy/heig/prod-pdg
      deploy_path: ${{ DEPLOY_PATH }}
    secrets: inherit
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}


  # 1rst version of deployment
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login au registry GitHub
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image (latest + sha)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/heig-echange/heig-echange:latest
            ghcr.io/heig-echange/heig-echange:${{ github.sha }}

      - name: Redeploiement Render
        if: hashFiles('Dockerfile') != ''
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK"
            echo "Redeploiement declenche"
          else
            echo "RENDER_DEPLOY_HOOK pas encore configure, etape sautee"
          fi
