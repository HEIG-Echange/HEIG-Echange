# ---------------------------------------------------------------------------
# CD — deploiement sur les machines distantes.
#
#   push sur staging           -> deploiement staging automatiquement
#   merge sur main             -> deploiement production automatiquement
#   declenchement manuel       -> staging ou production
#
# L'environnement "production" peut en plus exiger une approbation
# (Settings > Environments > production > Required reviewers).
# ---------------------------------------------------------------------------
name: CD

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement a deployer"
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cd-${{ github.ref_name }}

jobs:
  # Le deploiement construit l'image sur la machine cible : on revalide donc le
  # commit ici avant de toucher a une machine, plutot que de faire confiance a
  # un run de CI voisin.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint et tests dans l'image
        run: docker build --target verify .


  # Note : un job qui appelle un workflow reutilisable (uses:) n'accepte que
  # with / secrets / needs / if / permissions / concurrency. Pas de env: ni de
  # steps:. Les secrets sont transmis par "secrets: inherit" (les secrets du
  # repository + ceux de l'environnement cible declare dans deploy.yml).
  #
  # deploy_path n'est qu'un defaut de repli : si le secret d'environnement
  # DEPLOY_PATH est defini (recommande, une valeur par environnement), il gagne.
  staging:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'staging')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      deploy_path: /home/heigdeploy/heig/staging-pdg
    secrets: inherit

  production:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      deploy_path: /home/heigdeploy/heig/prod-pdg
    secrets: inherit


  # 1rst version of deployment
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login au registry GitHub
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image (latest + sha)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/heig-echange/heig-echange:latest
            ghcr.io/heig-echange/heig-echange:${{ github.sha }}

      - name: Redeploiement Render
        if: hashFiles('Dockerfile') != ''
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK"
            echo "Redeploiement declenche"
          else
            echo "RENDER_DEPLOY_HOOK pas encore configure, etape sautee"
          fi
