# ---------------------------------------------------------------------------
# CD — deploiement sur machine distante (production, staging).
#
#   push sur staging           -> deploiement auto sur staging
#   merge sur main             -> deploiement auto sur production
#   declenchement manuel       -> staging ou production
#
#   # en plus du CD staging/prod, 
#   # il y a des environnements de tests utilisables par
#   # développeurs de l équipe pour itération rapide
#   push sur branche "deva"    -> deploiement auto sur environnement dev1
#   push sur branche "devb"    -> deploiement auto sur environnement dev2
# ---------------------------------------------------------------------------
name: CD

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement a deployer"
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cd-${{ github.ref_name }}

jobs:
  # Le deploiement construit l'image sur la machine cible : on revalide donc le
  # commit ici avant de toucher une machine, plutot que de faire confiance au
  # run de CI.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint et tests dans l'image
        run: docker build --target verify .


  # Note (lecon) : un job qui appelle un workflow reutilisable
  # i.e. qui contient (uses:) n'accepte que
  # with / secrets / needs / if / permissions / concurrency. 
  # Donc pas de env: ni de steps:
  # Les secrets sont transmis par "secrets: inherit" (les secrets du
  # repository + ceux de l'environnement cible declaré dans deploy.yml).
  #
  # deploy_path juste valeur par defaut (si oubli de créer un
  # environnement dédié): si le secret d'environnement
  # DEPLOY_PATH est defini (sécu tip: pour ne pas exposer
  # chemin sur machine cible)
  # il a précédence.

  ## Debut: environnement de dev en CD.
  deva:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'deva')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'deva')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: deva
      deploy_path: /home/heigdeploy/heig/deva-pdg
    secrets: inherit

  devb:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'devb')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'devb')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: devb
      deploy_path: /home/heigdeploy/heig/devb-pdg
    secrets: inherit

  devc:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'devc')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'devc')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: devc
      deploy_path: /home/heigdeploy/heig/devc-pdg
    secrets: inherit
  ## / Fin: environnement de dev en CD.


  ## Staging et production

  staging:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'staging')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      deploy_path: /home/heigdeploy/heig/staging-pdg
    secrets: inherit

  production:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      deploy_path: /home/heigdeploy/heig/prod-pdg
    secrets: inherit
  ## /

  # Deployer image dans Github registry
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login au registry GitHub
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image (latest + sha)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/heig-echange/heig-echange:latest
            ghcr.io/heig-echange/heig-echange:${{ github.sha }}

      - name: Redeploiement Render
        if: hashFiles('Dockerfile') != ''
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK"
            echo "Redeploiement declenche"
          else
            echo "RENDER_DEPLOY_HOOK pas encore configure, etape sautee"
          fi
