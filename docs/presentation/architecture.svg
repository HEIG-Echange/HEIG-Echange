<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1600" height="940" fill="#ffffff"/>

  <!-- ===== En-tete ===== -->
  <text x="60" y="56" font-size="32" font-weight="700" fill="#1a1816">HEIG-Échange — Architecture technique</text>
  <text x="60" y="86" font-size="16" fill="#6f6b65">Application web mobile-first · Node 22 / Express 5 (TypeScript) · MariaDB 11.4 · tout tourne en conteneurs Docker</text>
  <rect x="60" y="100" width="130" height="4" fill="#c8102e"/>
  <rect x="190" y="101" width="1350" height="2" fill="#e6e2dc"/>

  <!-- ===== Titres de colonnes ===== -->
  <text x="60" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">CLIENT</text>
  <text x="390" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">EXPOSITION</text>
  <text x="640" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">HÉBERGEMENT — VPS</text>
  <text x="1220" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">SERVICES EXTERNES</text>

  <!-- ===== Colonne 1 : navigateur ===== -->
  <rect x="60" y="185" width="280" height="250" rx="14" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="82" y="222" font-size="20" font-weight="700" fill="#1a1816">Navigateur</text>
  <text x="82" y="246" font-size="13" fill="#6f6b65">mobile · tablette · desktop</text>
  <text x="82" y="284" font-size="14" fill="#1a1816">12 pages HTML statiques</text>
  <text x="82" y="310" font-size="14" fill="#1a1816">Modules JS natifs (pas de bundler)</text>
  <text x="82" y="336" font-size="14" fill="#1a1816">Tailwind CDN + css/app.css</text>
  <text x="82" y="362" font-size="14" fill="#1a1816">Appels fetch → API JSON</text>
  <text x="82" y="388" font-size="14" fill="#1a1816">Cookie de session httpOnly</text>
  <text x="82" y="414" font-size="14" fill="#1a1816">Aucune clé secrète côté client</text>

  <!-- Teams / mailto (cote client) -->
  <rect x="60" y="470" width="280" height="120" rx="14" fill="#ffffff" stroke="#b9b4ad" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="82" y="503" font-size="17" font-weight="700" fill="#1a1816">Teams · mailto</text>
  <text x="82" y="528" font-size="13.5" fill="#6f6b65">Lien profond ouvert par le navigateur</text>
  <text x="82" y="550" font-size="13.5" fill="#6f6b65">teams.microsoft.com/l/chat/…</text>
  <text x="82" y="572" font-size="13.5" fill="#6f6b65">Aucune intégration côté serveur</text>
  <line x1="200" y1="435" x2="200" y2="464" stroke="#b9b4ad" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="200,470 195,460 205,460" fill="#b9b4ad"/>

  <!-- ===== Colonne 2 : reverse proxy ===== -->
  <rect x="390" y="185" width="210" height="215" rx="14" fill="#fdeef1" stroke="#edc3cb" stroke-width="1.5"/>
  <text x="410" y="222" font-size="18" font-weight="700" fill="#1a1816">Reverse proxy</text>
  <text x="410" y="244" font-size="13" fill="#6f6b65">PHP · hébergement mutualisé</text>
  <text x="410" y="282" font-size="13.5" fill="#1a1816">index.php + cURL</text>
  <text x="410" y="306" font-size="13.5" fill="#1a1816">Relaie chemin, query,</text>
  <text x="410" y="326" font-size="13.5" fill="#1a1816">en-têtes et corps</text>
  <text x="410" y="352" font-size="13.5" fill="#1a1816">Donne un nom de domaine</text>
  <text x="410" y="372" font-size="13.5" fill="#1a1816">public au VPS (port NAT)</text>

  <!-- fleche client -> proxy -->
  <line x1="342" y1="300" x2="380" y2="300" stroke="#6f6b65" stroke-width="2"/>
  <polygon points="388,300 378,295 378,305" fill="#6f6b65"/>
  <text x="344" y="290" font-size="12" fill="#6f6b65">HTTPS</text>

  <!-- fleche proxy -> docker -->
  <line x1="602" y1="300" x2="626" y2="300" stroke="#6f6b65" stroke-width="2"/>
  <polygon points="634,300 624,295 624,305" fill="#6f6b65"/>
  <text x="603" y="290" font-size="12" fill="#6f6b65">HTTP</text>

  <!-- ===== Colonne 3 : hote Docker ===== -->
  <rect x="640" y="165" width="540" height="620" rx="16" fill="#faf9f7" stroke="#b9b4ad" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="662" y="192" font-size="16" font-weight="700" fill="#1a1816">Docker Compose — machine de déploiement</text>

  <rect x="662" y="208" width="496" height="250" rx="12" fill="#eef3fa" stroke="#b7c9e2" stroke-width="1.5"/>
  <text x="682" y="240" font-size="19" font-weight="700" fill="#1a1816">app — Express 5 / TypeScript</text>
  <text x="682" y="262" font-size="13" fill="#6f6b65">image multi-stage, utilisateur non-root, capabilities retirées</text>
  <text x="682" y="294" font-size="14" fill="#1a1816">Routes : /auth · /listings · /categories · /users</text>
  <text x="682" y="316" font-size="14" fill="#1a1816">/notifications · /friends-groups · /reports · /admin</text>
  <text x="682" y="344" font-size="14" fill="#1a1816">Middlewares : session, requireAuth, requireAdmin</text>
  <text x="682" y="366" font-size="14" fill="#1a1816">Upload multer → /app/uploads (5 Mo, MIME filtré)</text>
  <text x="682" y="388" font-size="14" fill="#1a1816">Sert public/ en statique · /health · /config</text>
  <text x="682" y="410" font-size="14" fill="#1a1816">Job quotidien : rappels de reconfirmation d'email</text>
  <text x="682" y="438" font-size="13" fill="#6f6b65">49 endpoints REST · réponses JSON · erreurs normalisées</text>

  <!-- volume uploads -->
  <rect x="948" y="478" width="210" height="62" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="966" y="505" font-size="14" font-weight="700" fill="#1a1816">volume uploads-data</text>
  <text x="966" y="526" font-size="12.5" fill="#6f6b65">photos des annonces</text>
  <line x1="900" y1="509" x2="938" y2="509" stroke="#b9b4ad" stroke-width="2"/>
  <polygon points="946,509 936,504 936,514" fill="#b9b4ad"/>

  <!-- fleche app -> db -->
  <line x1="760" y1="458" x2="760" y2="552" stroke="#6f6b65" stroke-width="2"/>
  <polygon points="760,560 755,550 765,550" fill="#6f6b65"/>
  <text x="775" y="500" font-size="13" fill="#6f6b65">mysql2 — pool de 10</text>
  <text x="775" y="520" font-size="13" fill="#6f6b65">connexions (3306)</text>

  <rect x="662" y="560" width="496" height="120" rx="12" fill="#eef6ef" stroke="#bcd8c0" stroke-width="1.5"/>
  <text x="682" y="592" font-size="19" font-weight="700" fill="#1a1816">db — MariaDB 11.4 (LTS)</text>
  <text x="682" y="618" font-size="14" fill="#1a1816">13 tables · index FULLTEXT pour la recherche · volume db-data</text>
  <text x="682" y="640" font-size="14" fill="#1a1816">Init automatique : db/init/01-schema-v2.sql + 02-seed.sql</text>
  <text x="682" y="662" font-size="14" fill="#1a1816">Migrations versionnées et idempotentes (db/migrations/)</text>

  <rect x="662" y="700" width="496" height="66" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="682" y="728" font-size="16" font-weight="700" fill="#1a1816">phpMyAdmin — profil « tools »</text>
  <text x="682" y="751" font-size="13.5" fill="#6f6b65">jamais exposé sur Internet : accès admin par tunnel SSH</text>

  <!-- ===== Colonne 4 : services externes ===== -->
  <rect x="1220" y="208" width="320" height="130" rx="14" fill="#fdf4e7" stroke="#e6cfa6" stroke-width="1.5"/>
  <text x="1240" y="240" font-size="18" font-weight="700" fill="#1a1816">Service d'envoi d'email</text>
  <text x="1240" y="264" font-size="13.5" fill="#6f6b65">API HTTP externe, clé X-API-Key</text>
  <text x="1240" y="292" font-size="14" fill="#1a1816">Codes de confirmation à 8 chiffres</text>
  <text x="1240" y="314" font-size="14" fill="#1a1816">Rappels et suspension de compte</text>

  <rect x="1220" y="368" width="320" height="150" rx="14" fill="#fdf4e7" stroke="#e6cfa6" stroke-width="1.5"/>
  <text x="1240" y="400" font-size="18" font-weight="700" fill="#1a1816">Hugging Face — Inference</text>
  <text x="1240" y="424" font-size="13.5" fill="#6f6b65">API compatible OpenAI, appelée en fetch</text>
  <text x="1240" y="452" font-size="14" fill="#1a1816">Analyse la photo d'un objet et</text>
  <text x="1240" y="474" font-size="14" fill="#1a1816">pré-remplit catégorie, état, description</text>
  <text x="1240" y="500" font-size="13.5" fill="#6f6b65">Modèle et prompts modifiables par un admin</text>

  <rect x="1220" y="548" width="320" height="150" rx="14" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="1240" y="580" font-size="18" font-weight="700" fill="#1a1816">Sauvegardes</text>
  <text x="1240" y="604" font-size="13.5" fill="#6f6b65">scripts/db-backup.sh · db-restore.sh</text>
  <text x="1240" y="632" font-size="14" fill="#1a1816">Dump gzip automatique avant chaque</text>
  <text x="1240" y="654" font-size="14" fill="#1a1816">déploiement (pre-deploy-*.sql.gz)</text>
  <text x="1240" y="680" font-size="13.5" fill="#6f6b65">Restauration par un seul script</text>

  <!-- fleches app -> services externes -->
  <line x1="1160" y1="270" x2="1206" y2="270" stroke="#6f6b65" stroke-width="2"/>
  <polygon points="1214,270 1204,265 1204,275" fill="#6f6b65"/>
  <line x1="1160" y1="330" x2="1190" y2="330" stroke="#6f6b65" stroke-width="2"/>
  <line x1="1190" y1="330" x2="1190" y2="425" stroke="#6f6b65" stroke-width="2"/>
  <line x1="1190" y1="425" x2="1206" y2="425" stroke="#6f6b65" stroke-width="2"/>
  <polygon points="1214,425 1204,420 1204,430" fill="#6f6b65"/>

  <!-- ===== Bandeau CI/CD ===== -->
  <rect x="60" y="815" width="1480" height="95" rx="14" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <rect x="60" y="815" width="6" height="95" rx="3" fill="#c8102e"/>
  <text x="88" y="848" font-size="18" font-weight="700" fill="#1a1816">CI / CD — GitHub Actions</text>
  <text x="88" y="872" font-size="13" fill="#6f6b65">workflows ci · cd · deploy · secrets-scan</text>
  <text x="400" y="848" font-size="14" fill="#1a1816"><tspan font-weight="700">CI</tspan> (chaque pull request) : ESLint · Vitest · build TypeScript · image Docker cible « verify » · suite d'API Bruno · scan de secrets</text>
  <text x="400" y="878" font-size="14" fill="#1a1816"><tspan font-weight="700">CD</tspan> : archive du commit → SSH → docker compose up --build --wait → healthcheck /health · environnements deva/devb/devc, staging, production</text>
</svg>
