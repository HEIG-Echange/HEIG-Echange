<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1600" height="940" fill="#ffffff"/>

  <!-- ===== En-tete ===== -->
  <text x="60" y="56" font-size="32" font-weight="700" fill="#1a1816">HEIG-Échange — Fonctionnement du frontend</text>
  <text x="60" y="86" font-size="16" fill="#6f6b65">Pages HTML statiques servies par Express · modules JavaScript natifs · ni framework, ni bundler, ni étape de build côté client</text>
  <rect x="60" y="100" width="130" height="4" fill="#c8102e"/>
  <rect x="190" y="101" width="1350" height="2" fill="#e6e2dc"/>

  <text x="60" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">ANATOMIE D'UNE PAGE</text>
  <text x="540" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">CE QUI SE PASSE AU CHARGEMENT</text>
  <text x="1100" y="146" font-size="13" font-weight="700" fill="#c8102e" letter-spacing="1.5">TROIS PALIERS, UN SEUL DOM</text>

  <!-- ===== Colonne 1 : anatomie ===== -->
  <rect x="60" y="175" width="440" height="140" rx="14" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="82" y="207" font-size="18" font-weight="700" fill="#1a1816">index.html — la structure</text>
  <text x="82" y="234" font-size="14" fill="#1a1816">Conteneurs vides : nav, grille, cloche, chip compte</text>
  <text x="82" y="258" font-size="14" fill="#1a1816">Aucun contenu dupliqué d'une page à l'autre</text>
  <text x="82" y="290" font-size="13.5" fill="#6f6b65">&lt;script type="module" src="js/pages/home.js"&gt;</text>

  <line x1="280" y1="315" x2="280" y2="337" stroke="#b9b4ad" stroke-width="2"/>
  <polygon points="280,345 275,335 285,335" fill="#b9b4ad"/>

  <rect x="60" y="345" width="440" height="120" rx="14" fill="#eef3fa" stroke="#b7c9e2" stroke-width="1.5"/>
  <text x="82" y="377" font-size="18" font-weight="700" fill="#1a1816">js/pages/*.js — un module par page</text>
  <text x="82" y="404" font-size="14" fill="#1a1816">home · listing · add-listing · edit-listing · login · register</text>
  <text x="82" y="426" font-size="14" fill="#1a1816">verify · profile · user · notifications · admin · admin-ai</text>
  <text x="82" y="450" font-size="13.5" fill="#6f6b65">Il ne contient que ce qui est propre à la page</text>

  <line x1="280" y1="465" x2="280" y2="487" stroke="#b9b4ad" stroke-width="2"/>
  <polygon points="280,495 275,485 285,485" fill="#b9b4ad"/>

  <rect x="60" y="495" width="440" height="190" rx="14" fill="#fdeef1" stroke="#edc3cb" stroke-width="1.5"/>
  <text x="82" y="527" font-size="18" font-weight="700" fill="#1a1816">Modules partagés — le socle commun</text>
  <text x="82" y="556" font-size="14" fill="#1a1816"><tspan font-weight="700">api.js</tspan> — client fetch, session, /config, libellés, échappement</text>
  <text x="82" y="580" font-size="14" fill="#1a1816"><tspan font-weight="700">ui.js</tspan> — navigation, cartes d'annonce, partage, notifications</text>
  <text x="82" y="604" font-size="14" fill="#1a1816"><tspan font-weight="700">listing-form.js</tspan> — un seul formulaire : création ET édition</text>
  <text x="82" y="628" font-size="14" fill="#1a1816"><tspan font-weight="700">photo-picker.js</tspan> — choix, contrôle, ordre et envoi des photos</text>
  <text x="82" y="660" font-size="13.5" fill="#6f6b65">Chaque page pose des conteneurs vides, ces modules les remplissent.</text>
  <text x="82" y="678" font-size="13.5" fill="#6f6b65">La navigation ne peut donc plus diverger d'un écran à l'autre.</text>

  <rect x="60" y="705" width="440" height="80" rx="14" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="82" y="736" font-size="17" font-weight="700" fill="#1a1816">Style — css/app.css + tailwind-setup.js</text>
  <text x="82" y="762" font-size="13.5" fill="#6f6b65">Tailwind par CDN, variables de couleur et shell responsive maison</text>

  <!-- ===== Colonne 2 : cycle de vie ===== -->
  <line x1="566" y1="200" x2="566" y2="745" stroke="#e6e2dc" stroke-width="3"/>

  <circle cx="566" cy="200" r="16" fill="#c8102e"/>
  <text x="566" y="206" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="600" y="196" font-size="16.5" font-weight="700" fill="#1a1816">Le HTML arrive</text>
  <text x="600" y="219" font-size="13.5" fill="#6f6b65">Express sert public/ tel quel — pas de rendu serveur</text>

  <circle cx="566" cy="278" r="16" fill="#c8102e"/>
  <text x="566" y="284" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="600" y="274" font-size="16.5" font-weight="700" fill="#1a1816">Le module de la page démarre</text>
  <text x="600" y="297" font-size="13.5" fill="#6f6b65">import ES natif : le navigateur charge api.js et ui.js</text>

  <circle cx="566" cy="356" r="16" fill="#c8102e"/>
  <text x="566" y="362" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="600" y="352" font-size="16.5" font-weight="700" fill="#1a1816">ui.js monte le shell</text>
  <text x="600" y="375" font-size="13.5" fill="#6f6b65">mountNav · chip du compte · cloche de notifications</text>

  <circle cx="566" cy="434" r="16" fill="#c8102e"/>
  <text x="566" y="440" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="600" y="430" font-size="16.5" font-weight="700" fill="#1a1816">Contrôle de la session — GET /auth/me</text>
  <text x="600" y="453" font-size="13.5" fill="#6f6b65">401 → login.html · EMAIL_REVERIFICATION_REQUIRED → verify.html</text>
  <text x="600" y="473" font-size="13.5" fill="#6f6b65">Échéance proche → bandeau d'avertissement</text>

  <circle cx="566" cy="512" r="16" fill="#c8102e"/>
  <text x="566" y="518" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="600" y="508" font-size="16.5" font-weight="700" fill="#1a1816">Configuration publique — GET /config</text>
  <text x="600" y="531" font-size="13.5" fill="#6f6b65">Mémoïsée : domaine public, taille et nombre de photos autorisés</text>

  <circle cx="566" cy="590" r="16" fill="#c8102e"/>
  <text x="566" y="596" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="600" y="586" font-size="16.5" font-weight="700" fill="#1a1816">Données — GET /listings?q=&amp;category=</text>
  <text x="600" y="609" font-size="13.5" fill="#6f6b65">L'API renvoie du JSON, ui.js fabrique les cartes</text>

  <circle cx="566" cy="668" r="16" fill="#c8102e"/>
  <text x="566" y="674" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="600" y="664" font-size="16.5" font-weight="700" fill="#1a1816">Interactions</text>
  <text x="600" y="687" font-size="13.5" fill="#6f6b65">Recherche à la frappe (anti-rebond) · onglets de catégories</text>
  <text x="600" y="707" font-size="13.5" fill="#6f6b65">Bascule grille / compact mémorisée dans localStorage</text>

  <circle cx="566" cy="745" r="16" fill="#1a1816"/>
  <text x="566" y="751" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="600" y="741" font-size="16.5" font-weight="700" fill="#1a1816">Une seule requête par action, pas de rechargement</text>
  <text x="600" y="764" font-size="13.5" fill="#6f6b65">Chaque page reste indépendante : une erreur n'emporte pas l'app</text>

  <!-- ===== Colonne 3 : responsive ===== -->
  <!-- mobile -->
  <rect x="1120" y="185" width="110" height="200" rx="12" fill="#faf9f7" stroke="#b9b4ad" stroke-width="1.5"/>
  <rect x="1128" y="193" width="94" height="16" rx="4" fill="#e6e2dc"/>
  <rect x="1128" y="217" width="94" height="46" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1128" y="269" width="94" height="46" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1128" y="353" width="94" height="24" rx="6" fill="#d9d5cf"/>
  <circle cx="1200" cy="347" r="12" fill="#c8102e"/>
  <text x="1200" y="352" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  <text x="1120" y="407" font-size="14" font-weight="700" fill="#1a1816">&lt; 768 px — mobile</text>
  <text x="1120" y="427" font-size="13" fill="#6f6b65">Barre de nav en bas,</text>
  <text x="1120" y="445" font-size="13" fill="#6f6b65">bouton « + » flottant, 1 colonne</text>

  <!-- tablette -->
  <rect x="1280" y="185" width="180" height="160" rx="12" fill="#faf9f7" stroke="#b9b4ad" stroke-width="1.5"/>
  <rect x="1288" y="193" width="22" height="144" rx="6" fill="#d9d5cf"/>
  <rect x="1318" y="193" width="134" height="14" rx="4" fill="#e6e2dc"/>
  <rect x="1318" y="215" width="64" height="44" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1388" y="215" width="64" height="44" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1318" y="265" width="64" height="44" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1388" y="265" width="64" height="44" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <text x="1280" y="367" font-size="14" font-weight="700" fill="#1a1816">≥ 768 px — tablette</text>
  <text x="1280" y="387" font-size="13" fill="#6f6b65">Barre latérale en icônes,</text>
  <text x="1280" y="405" font-size="13" fill="#6f6b65">plusieurs colonnes</text>

  <!-- desktop -->
  <rect x="1120" y="480" width="420" height="190" rx="12" fill="#faf9f7" stroke="#b9b4ad" stroke-width="1.5"/>
  <rect x="1130" y="490" width="66" height="170" rx="6" fill="#d9d5cf"/>
  <rect x="1206" y="490" width="324" height="16" rx="4" fill="#e6e2dc"/>
  <rect x="1206" y="516" width="100" height="60" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1318" y="516" width="100" height="60" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1430" y="516" width="100" height="60" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1206" y="586" width="100" height="60" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1318" y="586" width="100" height="60" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <rect x="1430" y="586" width="100" height="60" rx="6" fill="#eef3fa" stroke="#b7c9e2"/>
  <text x="1120" y="694" font-size="14" font-weight="700" fill="#1a1816">≥ 1024 px — desktop</text>
  <text x="1120" y="714" font-size="13" fill="#6f6b65">Barre latérale déployée, contenu centré et borné à 80 rem,</text>
  <text x="1120" y="732" font-size="13" fill="#6f6b65">choix entre affichage grille et affichage compact</text>

  <rect x="1120" y="750" width="420" height="52" rx="12" fill="#fdeef1" stroke="#edc3cb" stroke-width="1.5"/>
  <text x="1138" y="774" font-size="13.5" fill="#1a1816">Le HTML est le même partout : c'est la CSS qui déplace la</text>
  <text x="1138" y="792" font-size="13.5" fill="#1a1816">navigation — aucun saut, aucun rechargement.</text>

  <!-- ===== Bandeau : regles transverses ===== -->
  <rect x="60" y="825" width="285" height="90" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="78" y="853" font-size="14.5" font-weight="700" fill="#c8102e">Liens de partage fiables</text>
  <text x="78" y="876" font-size="12.5" fill="#1a1816">QR, mail, copie de lien : construits à</text>
  <text x="78" y="894" font-size="12.5" fill="#1a1816">partir du domaine public du serveur.</text>

  <rect x="355" y="825" width="285" height="90" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="373" y="853" font-size="14.5" font-weight="700" fill="#c8102e">Photos contrôlées avant envoi</text>
  <text x="373" y="876" font-size="12.5" fill="#1a1816">Taille, type et nombre viennent de</text>
  <text x="373" y="894" font-size="12.5" fill="#1a1816">/config : refus immédiat, message clair.</text>

  <rect x="650" y="825" width="285" height="90" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="668" y="853" font-size="14.5" font-weight="700" fill="#c8102e">Contenu utilisateur échappé</text>
  <text x="668" y="876" font-size="12.5" fill="#1a1816">Tout texte saisi passe par escapeHtml</text>
  <text x="668" y="894" font-size="12.5" fill="#1a1816">avant insertion dans le DOM.</text>

  <rect x="945" y="825" width="285" height="90" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="963" y="853" font-size="14.5" font-weight="700" fill="#c8102e">Aucun secret côté client</text>
  <text x="963" y="876" font-size="12.5" fill="#1a1816">Clés mail et IA restent sur le serveur ;</text>
  <text x="963" y="894" font-size="12.5" fill="#1a1816">le client n'a qu'un cookie httpOnly.</text>

  <rect x="1240" y="825" width="285" height="90" rx="12" fill="#f5f4f0" stroke="#d9d5cf" stroke-width="1.5"/>
  <text x="1258" y="853" font-size="14.5" font-weight="700" fill="#c8102e">Testabilité assumée</text>
  <text x="1258" y="876" font-size="12.5" fill="#1a1816">Pas d'environnement DOM en CI : la</text>
  <text x="1258" y="894" font-size="12.5" fill="#1a1816">logique testable vit côté serveur.</text>
</svg>
